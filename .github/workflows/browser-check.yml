name: Browser Check

# Builds the static site, serves out/ on localhost, and runs the Playwright
# browser check in Chromium (tests/browser/site.spec.ts): pages load with the
# right title and heading, the sidebar and highlighted code are present, and
# in-site navigation works. The full-page screenshots are kept as an artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-check:
    name: Build and browser check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Runner size
        run: |
          nproc
          free -m
      - name: Facing text check
        run: npm run facing-text:check
      - run: npm ci
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: /usr/bin/time -v npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check
        env:
          BROWSER_CHECK_SHOTS: test-results/screenshots
        run: /usr/bin/time -v npm run test:browser
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check-screenshots
          path: test-results/
          retention-days: 14
